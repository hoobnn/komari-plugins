name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check plugin scripts
        run: for script in */script.js; do node --check "$script"; done
      - name: Check README plugin tables
        run: pnpm readme --check
      - name: Build all plugins
        run: pnpm build
